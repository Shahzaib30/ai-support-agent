version: "3.9"

services:

  # ─────────────────────────────────────────
  # FASTAPI APP
  # ─────────────────────────────────────────
  api:
    build: .
    container_name: ai-support-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./docs:/app/docs                           # your documents
      - ./vector_store:/app/vector_store           # FAISS index
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - support-network

  # ─────────────────────────────────────────
  # POSTGRESQL
  # ─────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: ai-support-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB:       ai_support_agent
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: shahzaib123
    volumes:
      - postgres_data:/var/lib/postgresql/data     # data persists
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql  # auto runs on first start
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - support-network
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai-support-frontend
    ports:
      - "3001:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - support-network

  # ─────────────────────────────────────────
  # REDIS
  # ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ai-support-redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data                           # cache persists
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - support-network

  # ─────────────────────────────────────────
  # PROMETHEUS
  # scrapes metrics from FastAPI /metrics
  # ─────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: ai-support-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - support-network

  # ─────────────────────────────────────────
  # GRAFANA
  # visualizes Prometheus metrics
  # ─────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: ai-support-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER:     admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP:     "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - support-network

    # ─────────────────────────────────────────
  # N8N
  # ─────────────────────────────────────────
  n8n:
    image: n8nio/n8n
    container_name: ai-support-n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=admin
      - WEBHOOK_URL=http://localhost:5678
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - support-network

# ─────────────────────────────────────────
# VOLUMES
# data that persists when containers restart
# ─────────────────────────────────────────
volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
  n8n_data:

# ─────────────────────────────────────────
# NETWORK
# all containers talk to each other here
# ─────────────────────────────────────────
networks:
  support-network:
    driver: bridge